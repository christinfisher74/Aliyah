function animateCountUp(el,target){const start=0,dur=700,t0=performance.now();function tick(now){const p=Math.min((now-t0)/dur,1);const e=1-Math.pow(1-p,3);el.textContent=Math.round(start+(target-start)*e);if(p<1)requestAnimationFrame(tick);else el.textContent=target;}requestAnimationFrame(tick);}

function wireMiniTimer(key,seconds){
  if(!miniTimerStates.has(key))miniTimerStates.set(key,{remaining:seconds,total:seconds,interval:null});
  const startBtn=document.querySelector(`[data-mt-start="${key}"]`),resetBtn=document.querySelector(`[data-mt-reset="${key}"]`);
  if(startBtn)startBtn.onclick=()=>{
    const st=miniTimerStates.get(key);
    if(st.interval)return;
    st.interval=setInterval(()=>{
      st.remaining--;
      const d=document.getElementById('mt-display-'+key);if(d)d.textContent=fmtTimer(Math.max(st.remaining,0));
      if(st.remaining<=0){clearInterval(st.interval);st.interval=null;celebrate("Time's up",'⏱',false);if(navigator.vibrate)navigator.vibrate([200,100,200]);}
    },1000);
  };
  if(resetBtn)resetBtn.onclick=()=>{
    const st=miniTimerStates.get(key);
    if(st.interval)clearInterval(st.interval);
    st.interval=null;st.remaining=st.total;
    const d=document.getElementById('mt-display-'+key);if(d)d.textContent=fmtTimer(st.remaining);
  };
}

  document.querySelectorAll('[data-toggle]').forEach(bar=>{

async function getLastSessionValues(prog,order){
  const result={};
  if(!supabaseReady)return result;
  const {data}=await sb.from('aliyah_sessions').select('date,exercises').order('date',{ascending:false}).limit(20);
  if(!data)return result;
  for(const key of order){
    const wantName=prog[key].name;
    for(const row of data){
      const ex=row.exercises&&row.exercises[key];
      if(ex&&ex.name===wantName&&(ex.weight||ex.sets_reps)){result[key]={weight:ex.weight,sets_reps:ex.sets_reps,date:row.date};break;}
    }
  }
  return result;
}
async function saveSession(split){
  if(!supabaseReady){alert('Add your Supabase key in index.html first.');return;}
  const phaseIdx=currentPhase(currentWeek()).idx,prog=PROGRAM[phaseIdx][split],order=orderForSplit(split);
  const exercises={};order.forEach(key=>{const wt=$('wt-'+key).value.trim(),sr=$('sr-'+key).value.trim();if(wt||sr)exercises[key]={name:prog[key].name,weight:wt,sets_reps:sr};});
  if(!Object.keys(exercises).length){alert('Log at least one exercise first.');return;}
  const btn=$('saveSessionBtn');btn.disabled=true;btn.textContent='Saving...';
  const {error}=await sb.from('aliyah_sessions').insert({date:todayISO(),session_type:split,exercises});
  btn.disabled=false;btn.textContent="Save today's session";
  if(error){alert('Something went wrong saving that. Try again.');return;}
  celebrate('Session logged — nice work','💪');loadSessions();
}

    let p={};try{p=JSON.parse(String(r.note).slice(marker.length));}catch(e){}
    const fields=[['Weight',p.weight,'lb'],['Estimated lean mass',p.leanMass,'lb'],['Estimated body fat',p.bodyFat,'%'],['BMI',p.bmi,''],['Body water',p.bodyWater,'%'],['Muscle',p.muscle,' %'],['Visceral fat index',p.visceralFat,''],['Subcutaneous fat',p.subcutaneousFat,'lb']].filter(x=>x[1]!==''&&x[1]!=null);
    return `<article class="card" style="padding:12px;margin:8px 0;"><div class="row-date">${fmtShort(r.date)}</div>${fields.map(x=>`<div class="list-row"><span>${x[0]}</span><strong>${x[1]}${x[2]}</strong></div>`).join('')}${p.strength?'<p><b>Strength:</b> '+p.strength+'</p>':''}${p.notes?'<p>'+p.notes+'</p>':''}</article>`;
  }).join(''):'<div class="empty-state">Your coach\'s progress updates will appear here.</div>';
}
async function uploadPhoto(e){
  const file=e.target.files[0];if(!file)return;
  $('photoStatus').textContent='Uploading...';
  const path=`${todayISO()}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
  const {error:upErr}=await sb.storage.from('aliyah-photos').upload(path,file);
  if(upErr){$('photoStatus').textContent='Upload failed. Try again.';return;}
  const {data:urlData}=sb.storage.from('aliyah-photos').getPublicUrl(path);
  await sb.from('aliyah_photos').insert({date:todayISO(),path,url:urlData.publicUrl});
  $('photoStatus').textContent='';$('photoInput').value='';celebrate('Photo added','📸');loadPhotos();
}
async function loadPhotos(){
  if(!supabaseReady)return;
  const {data,error}=await sb.from('aliyah_photos').select('*').order('date',{ascending:false}).limit(30);
  if(error)return;
  if(!data||!data.length){$('photoGrid').innerHTML='<div class="empty-state" style="grid-column:1/-1;">No photos yet.</div>';return;}
  $('photoGrid').innerHTML=data.map(p=>`<div style="aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--cream-dark);"><img src="${p.url}" style="width:100%;height:100%;object-fit:cover;" loading="lazy"></div>`).join('');
}
async function loadStats(){
  if(!supabaseReady)return;
  const {count}=await sb.from('aliyah_sessions').select('*',{count:'exact',head:true});
  animateCountUp($('statSessions'),count||0);
  const {data:checkins}=await sb.from('aliyah_checkins').select('date').order('date',{ascending:false}).limit(60);
  let streak=0;
  if(checkins&&checkins.length){let cursor=new Date(todayISO()+'T00:00:00');const dateSet=new Set(checkins.map(c=>c.date));while(dateSet.has(isoFromDate(cursor))){streak++;cursor.setDate(cursor.getDate()-1);}}
  animateCountUp($('statStreak'),streak);maybeCelebrateStreak(streak);
}

renderShell();
showTab('today');
</script>
