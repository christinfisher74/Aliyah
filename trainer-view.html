<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1E3329">
<title>Coach View · Aliyah</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #1E3329; --taupe: #C4A882; --olive: #7A9E7E;
    --cream: #FAF7F2; --cream-dark: #F0EBE3; --black: #1A1A1A;
    --dgray: #555555; --mgray: #999999; --lgray: #E8E4DF; --white: #FFFFFF;
    --warn: #C4763A; --success: #2D5016;
    --radius: 14px; --radius-sm: 9px; --shadow: 0 2px 12px rgba(30,51,41,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans', sans-serif; background:var(--cream); color:var(--black);
    min-height:100vh; max-width:600px; margin:0 auto; padding-bottom:40px; }
  .topbar { background:var(--forest); color:var(--white); padding:26px 22px 22px; border-bottom:3px solid var(--taupe); }
  .topbar-eyebrow { font-size:10px; letter-spacing:2px; color:var(--taupe); font-weight:600; text-transform:uppercase; }
  .topbar-title { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; margin-top:2px; }
  .topbar-sub { font-size:12.5px; color:rgba(255,255,255,0.65); margin-top:3px; }
  .content { padding:20px; }
  .section-label { font-size:11px; letter-spacing:1px; color:var(--taupe); font-weight:700; text-transform:uppercase;
    margin:26px 0 10px; }
  .section-label:first-child { margin-top:0; }
  .card { background:var(--white); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:12px; }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:6px; }
  .stat-box { background:var(--white); border-radius:var(--radius); padding:14px 8px; box-shadow:var(--shadow); text-align:center; }
  .stat-num { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:600; color:var(--forest); }
  .stat-label { font-size:10px; color:var(--mgray); margin-top:2px; }
  .entry-row { padding:11px 0; border-bottom:1px solid var(--lgray); }
  .entry-row:last-child { border-bottom:none; }
  .entry-top { display:flex; justify-content:space-between; align-items:center; }
  .entry-date { font-size:11px; color:var(--mgray); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .entry-meta { font-size:12.5px; color:var(--dgray); margin-top:3px; }
  .pill { font-size:10px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .pill-good { background:#EAF2EE; color:var(--success); }
  .pill-busy { background:#FDF3E4; color:#8A6A2F; }
  .pill-horrible { background:#FDF0E6; color:var(--warn); }
  .empty-state { text-align:center; padding:20px 10px; color:var(--mgray); font-size:12.5px; }
  .photo-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .photo-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; }
  .refresh-btn { background:var(--forest); color:var(--white); font-weight:600; font-size:13px;
    padding:11px; border-radius:var(--radius-sm); width:100%; border:none; cursor:pointer; margin-top:4px; }
  .setup-note { color:var(--warn); font-size:13px; line-height:1.6; }

  /* ===== PROGRAM OVERVIEW ===== */
  .phase-card { background:var(--white); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); margin-bottom:12px; }
  .phase-tag { font-size:9.5px; letter-spacing:1px; color:var(--taupe); font-weight:700; text-transform:uppercase; }
  .phase-name { font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600; color:var(--forest); margin:2px 0 10px; }
  .prog-ex { padding:8px 0; border-bottom:1px solid var(--lgray); }
  .prog-ex:last-child { border-bottom:none; }
  .prog-ex-name { font-size:12.5px; font-weight:600; color:var(--black); }
  .prog-ex-cue { font-size:11px; color:var(--dgray); margin-top:2px; line-height:1.5; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-eyebrow">COACH VIEW · READ-ONLY</div>
  <div class="topbar-title">Aliyah</div>
  <div class="topbar-sub" id="lastUpdated">Loading...</div>
</div>

<div class="content" id="mainContent">

  <div class="stat-grid">
    <div class="stat-box"><div class="stat-num" id="statSessions">—</div><div class="stat-label">sessions</div></div>
    <div class="stat-box"><div class="stat-num" id="statCheckins">—</div><div class="stat-label">check-ins</div></div>
    <div class="stat-box"><div class="stat-num" id="statPhotos">—</div><div class="stat-label">photos</div></div>
  </div>

  <div class="section-label">Program overview — all 12 weeks</div>
  <div id="programOverview"></div>

  <div class="section-label">Check-ins</div>
  <div class="card"><div id="checkinList"><div class="empty-state">Loading...</div></div></div>

  <div class="section-label">Sessions logged</div>
  <div class="card"><div id="sessionList"><div class="empty-state">Loading...</div></div></div>

  <div class="section-label">Protein log</div>
  <div class="card"><div id="proteinList"><div class="empty-state">Loading...</div></div></div>

  <div class="section-label">Wins</div>
  <div class="card"><div id="winList"><div class="empty-state">Loading...</div></div></div>

  <div class="section-label">Progress photos</div>
  <div class="card"><div id="photoGrid" class="photo-grid"><div class="empty-state">Loading...</div></div></div>

  <button class="refresh-btn" id="refreshBtn">Refresh</button>
</div>

<script>
const SUPABASE_URL = 'https://mimaexschnbsdnfcluev.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE'; // same key as her app
let sb = null, ready = false;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); ready = true; } catch (e) { console.error(e); }

const $ = (id) => document.getElementById(id);
const fmtShort = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
const fmtWhen = () => new Date().toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });

/* ============ PROGRAM OVERVIEW (kept in sync with the app's PROGRAM object) ============ */
const PROGRAM_ORDER = ['squat','hinge','unilateral','push','pull','hipext','plank','carry','finisher'];
const PROGRAM = [
  { label:'Weeks 1-4 — Assess + Establish',
    squat:      { name:'Goblet squat',           cue:'3 x 8-10 · feet planted, weight through the whole foot. Sit back and down like reaching for a chair — chest stays tall.' },
    hinge:      { name:'DB Romanian deadlift',    cue:'3 x 8-10 · drive feet into the floor the whole rep — legs stabilize, not the low back. Only lower as far as she feels the hamstring stretch. The second the back wants to round, that\'s the floor for today.' },
    unilateral: { name:'Reverse lunge',           cue:'2-3 x 8/side · step back under control, front foot glued down. Knee tracks over the foot.' },
    push:       { name:'Seated DB shoulder press', cue:'3 x 8-10 · back pressed fully into the bench the whole set, legs planted and active. Press straight up without ribs flaring or arching off the bench.' },
    pull:       { name:'Seated cable row',        cue:'3 x 10 · pull with shoulder blades first, elbows stay close.' },
    hipext:     { name:'Glute bridge',            cue:'2-3 x 12 · feet close to hips, drive through heels, squeeze at the top.' },
    plank:      { name:'Front plank',             cue:'2-3 x 20-30 sec · full-body brace, no sagging or piking hips' },
    carry:      { name:'Suitcase carry',          cue:'light load · tall posture, no leaning toward the weight' },
    finisher:   { name:'Easy incline walk',       cue:'8-10 min · conversational pace' },
  },
  { label:'Weeks 5-8 — Build',
    squat:      { name:'Front squat',             cue:'3 x 6-8 · elbows up for rack position, brace hard before every rep.' },
    hinge:      { name:'Barbell RDL',              cue:'3 x 6-8 · same feeling as Phase 1, heavier bar: feet glued down, legs stabilizing, bar close to the legs. Stop the descent right where the hinge is felt — never round to chase depth.' },
    unilateral: { name:'Bulgarian split squat',    cue:'2-3 x 8/side · back foot elevated, most weight in the front foot. Control the lower.' },
    push:       { name:'Standing DB shoulder press', cue:'3 x 8-10 · braced standing like a plank — no leaning back to press. Ribs stacked over hips.' },
    pull:       { name:'Single-arm DB row',        cue:'3 x 10/side · free hand braced on bench. Row to the hip, squeeze the shoulder blade.' },
    hipext:     { name:'Barbell hip thrust',       cue:'3 x 10 · shoulder blades on bench, chin tucked. Drive through heels to full lockout, no hyperextending the low back.' },
    plank:      { name:'Side plank',               cue:'2-3 x 30-45 sec/side · stack hips and shoulders' },
    carry:      { name:"Farmer's carry",           cue:'moderate load · steady pace, tall posture' },
    finisher:   { name:'Rower or bike intervals',  cue:'8-10 min · work/rest intervals' },
  },
  { label:'Weeks 9-12 — Progress + Own It',
    squat:      { name:'Back squat',               cue:'3-4 x 5-6 · own the setup and bracing before unracking.' },
    hinge:      { name:'Trap bar deadlift',        cue:'3-4 x 5-6 · feet driving down, full-body tension before the pull. Depth is wherever the hamstrings allow a flat back — not an inch further.' },
    unilateral: { name:'Loaded walking lunge',     cue:'2-3 x 8/side · load stays over midline, front knee tracks straight.' },
    push:       { name:'Standing barbell/DB press', cue:'3 x 6-8 · same full-body brace, heavier load. Legs and core stabilize, not a low-back arch to finish the rep.' },
    pull:       { name:'Chest-supported row',      cue:'3 x 10 · chest pinned to the pad, pull with the back not the arms.' },
    hipext:     { name:'Single-leg hip thrust',    cue:'2-3 x 10/side · same drive-through-the-heel feeling, one leg at a time.' },
    plank:      { name:'Weighted / extended plank',cue:'2-3 x 45-60 sec · full brace maintained the entire time' },
    carry:      { name:"Heavy farmer's carry",     cue:'heaviest load · grip + total-body control' },
    finisher:   { name:'Short HIIT circuit',       cue:'8-10 min · her choice of format' },
  },
];

function renderProgramOverview() {
  $('programOverview').innerHTML = PROGRAM.map(phase => `
    <div class="phase-card">
      <div class="phase-tag">INDEPENDENT SESSION</div>
      <div class="phase-name">${phase.label}</div>
      ${PROGRAM_ORDER.map(key => `
        <div class="prog-ex">
          <div class="prog-ex-name">${phase[key].name}</div>
          <div class="prog-ex-cue">${phase[key].cue}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}
renderProgramOverview();

if (!ready) {
  const banner = document.createElement('div');
  banner.className = 'card';
  banner.innerHTML = '<div class="setup-note"><b>Setup needed:</b> paste your Supabase anon key in this file (same one as Aliyah\u2019s app) to load her check-in and log data below. The program overview above works either way.</div>';
  $('mainContent').prepend(banner);
}

async function loadAll() {
  if (!ready) return;
  $('lastUpdated').textContent = 'Updated ' + fmtWhen();

  const { data: checkins } = await sb.from('aliyah_checkins').select('*').order('date', { ascending:false }).limit(30);
  $('statCheckins').textContent = (checkins || []).length;
  $('checkinList').innerHTML = (checkins && checkins.length) ? checkins.map(row => `
    <div class="entry-row">
      <div class="entry-top">
        <span class="entry-date">${fmtShort(row.date)}</span>
        <span class="pill pill-${row.day_type}">${row.day_type}</span>
      </div>
      <div class="entry-meta">${row.trained ? '✓ trained' : 'no session'} · ${row.protein_hit ? '✓ protein' : 'protein missed'} · ${row.walked ? '✓ walk' : 'no walk logged'}</div>
      ${row.notes ? `<div class="entry-meta" style="font-style:italic; margin-top:4px;">"${row.notes}"</div>` : ''}
    </div>`).join('') : '<div class="empty-state">No check-ins yet.</div>';

  const { data: sessions, count: sessionCount } = await sb.from('aliyah_sessions').select('*', { count:'exact' }).order('date', { ascending:false }).limit(20);
  $('statSessions').textContent = sessionCount || 0;
  $('sessionList').innerHTML = (sessions && sessions.length) ? sessions.map(row => {
    const items = Object.values(row.exercises || {}).map(e => `${e.name}: ${e.sets_reps || '—'} @ ${e.weight || '—'}`).join(' · ');
    return `<div class="entry-row"><div class="entry-date">${fmtShort(row.date)}</div><div class="entry-meta">${items}</div></div>`;
  }).join('') : '<div class="empty-state">No sessions logged yet.</div>';

  const { data: protein } = await sb.from('aliyah_protein_log').select('*').order('created_at', { ascending:false }).limit(20);
  $('proteinList').innerHTML = (protein && protein.length) ? protein.map(r => `
    <div class="entry-row"><div class="entry-top"><span class="entry-date">${fmtShort(r.date)}</span><span class="entry-meta">${r.grams}g</span></div><div class="entry-meta">${r.item}</div></div>
  `).join('') : '<div class="empty-state">Nothing logged yet.</div>';

  const { data: wins } = await sb.from('aliyah_wins').select('*').order('date', { ascending:false }).limit(20);
  $('winList').innerHTML = (wins && wins.length) ? wins.map(r => `
    <div class="entry-row"><div class="entry-date">${fmtShort(r.date)}</div><div class="entry-meta">${r.note}</div></div>
  `).join('') : '<div class="empty-state">No wins logged yet.</div>';

  const { data: photos } = await sb.from('aliyah_photos').select('*').order('date', { ascending:false }).limit(30);
  $('statPhotos').textContent = (photos || []).length;
  $('photoGrid').innerHTML = (photos && photos.length)
    ? photos.map(p => `<img src="${p.url}" alt="${fmtShort(p.date)}" loading="lazy">`).join('')
    : '<div class="empty-state">No photos yet.</div>';
}

if (ready) {
  $('refreshBtn').addEventListener('click', loadAll);
  loadAll();
}
</script>
</body>
</html>
